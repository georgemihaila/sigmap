name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build .NET solution
        run: dotnet build Sigmap.slnx -c Release

      - name: Regenerate + check TS proto bindings
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run gen:proto
          git diff --exit-code frontend/src/generated/proto

      - name: Backend integration tests (Testcontainers)
        run: dotnet test backend/Sigmap.Backend.IntegrationTests -c Release --no-build

      - name: Scanner tests
        run: dotnet test scanner/Sigmap.Scanner.Tests -c Release --no-build

      - name: Frontend tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test -- --run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

  android-instrumented:
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }} # emulator is slow; run on demand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Start dependencies
        run: docker compose -f deploy/docker-compose.yml up -d postgres rabbitmq backend-api
      - name: Instrumented tests (pairing flow)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: android
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Psigmap.test.host=http://10.0.2.2:5080 -Psigmap.test.token=${{ secrets.PAIRING_TOKEN }}
      - name: Tear down
        run: docker compose -f deploy/docker-compose.yml down
