name: sigmap-test

# CI-friendly dependencies for integration tests. The test suite uses
# Testcontainers by default (real Postgres+PostGIS and RabbitMQ per run); this
# compose file is the alternative when you want shared containers instead.
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: sigmap
      POSTGRES_PASSWORD: sigmap
      POSTGRES_DB: sigmap_test
    ports:
      - "15432:5432"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sigmap
      RABBITMQ_DEFAULT_PASS: sigmap
    ports:
      - "15673:5672"
