name: sigmap

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: sigmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigmap}
      POSTGRES_DB: sigmap
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigmap -d sigmap"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sigmap
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-sigmap}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672" # management UI
      - "5672:5672"   # AMQP: host-run scanners connect here
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend-api
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=sigmap;Username=sigmap;Password=${POSTGRES_PASSWORD:-sigmap}
      ConnectionStrings__RabbitMq: amqp://sigmap:${RABBITMQ_PASSWORD:-sigmap}@rabbitmq:5672
      Pairing__Token: ${PAIRING_TOKEN:-sigmap-dev-token}
      Pairing__PublicHost: ${PUBLIC_HOST:-http://localhost:5080}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  bff:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bff
    environment:
      ConnectionStrings__RabbitMq: amqp://sigmap:${RABBITMQ_PASSWORD:-sigmap}@rabbitmq:5672
      Backend__BaseUrl: http://backend-api:8080
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5090:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend-api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    environment:
      VITE_PROXY_TARGET: http://bff:8080
      # gRPC-Web in dev: the browser reaches the BFF on its host-mapped port.
      VITE_BFF_URL: ${VITE_BFF_URL:-http://localhost:5090}
    ports:
      - "5173:5173"
    depends_on:
      - bff
    restart: unless-stopped

  # Synthetic-data scanner. Opt-in via profile so the default stack runs with
  # no simulated data: docker compose --profile sim up -d
  scanner-agent:
    profiles: ["sim"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.scanner-agent
    environment:
      SCANNER__RABBITMQ_URI: amqp://sigmap:${RABBITMQ_PASSWORD:-sigmap}@rabbitmq:5672
      SCANNER__SOURCE_TYPE: simulator
      SCANNER__DEVICE_ID: 11111111-1111-1111-1111-111111111111
      SCANNER__OFFLINE_DB: /data/buffer.db
      SCANNER__DEVICE_ID_FILE: /data/device.id
      SCANNER__DEBUG: ${SCANNER__DEBUG:-0}
    volumes:
      - scanner_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Real monitor-mode scanning needs host networking + caps + adapter passthrough:
  #   network_mode: host
  #   cap_add: [NET_ADMIN, NET_RAW]
  #   devices: [/dev/bus/usb/...]
  # (See docker-compose.prod.yml for the documented pattern.)

volumes:
  pgdata:
  rabbitmq_data:
  scanner_data:
