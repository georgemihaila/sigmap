syntax = "proto3";

package sigmap;

option csharp_namespace = "Sigmap.Contracts.Proto";

import "config.proto";

enum PairingStatus {
  PAIRING_STATUS_UNSPECIFIED = 0;
  PAIRING_PENDING = 1;
  PAIRING_APPROVED = 2;
  PAIRING_REJECTED = 3;
  PAIRING_TOKEN_EXPIRED = 4;
}

// Transported over REST (not RabbitMQ): pairing is a bootstrap operation and
// needs the short-lived QR token, which the broker is not involved in.
message PairingRequest {
  // Self-generated stable device id.
  string device_id = 1;
  string device_name = 2;
  // SHA-256 hex of the short-lived pairing token from the QR code.
  string token_hash = 3;
  DeviceCapabilities capabilities = 4;
  uint64 sent_at_unix_ms = 5;
}

message DeviceCapabilities {
  bool has_wifi_monitor = 1;
  bool has_bluetooth = 2;
  bool has_gps = 3;
  bool has_battery = 4;
  // Platform string, e.g. "linux-x64" or "android-14".
  string platform = 5;
}

message PairingResponse {
  PairingStatus status = 1;
  string device_id = 2;
  // Session the device is admitted to, if approved.
  string session_id = 3;
  // Always the built-in "Off" preset on first pair; nothing scans until a
  // user deliberately applies a preset.
  ScanConfig initial_config = 4;
  uint64 server_time_unix_ms = 5;
}
