syntax = "proto3";

package sigmap.live;

option csharp_namespace = "Sigmap.Contracts.Proto.Live";

import "detection.proto";
import "config.proto";
import "heartbeat.proto";

// BFF -> browser over gRPC-Web server-streaming. The BFF subscribes to the
// internal RabbitMQ events exchange and re-broadcasts to connected clients.
service LiveStream {
  rpc Subscribe(SubscribeRequest) returns (stream LiveEvent);
}

message SubscribeRequest {
  string session_id = 1;
  string client_id = 2;
}

message LiveEvent {
  oneof event {
    // Post-ingestion batch with server-resolved locations.
    sigmap.LocatedBatch detections = 1;
    DeviceStatusUpdate device = 2;
    ConfigPushStatus config = 3;
    FleetSnapshot fleet = 4;
  }
}

message DeviceStatusUpdate {
  string device_id = 1;
  sigmap.Heartbeat heartbeat = 2;
}

message ConfigPushStatus {
  string device_id = 1;
  string push_id = 2;
  string session_id = 3;
  sigmap.ConfigAckStatus status = 4;
}

message FleetSnapshot {
  repeated sigmap.Heartbeat devices = 1;
}
