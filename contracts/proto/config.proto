syntax = "proto3";

package sigmap;

option csharp_namespace = "Sigmap.Contracts.Proto";

enum ConfigAckStatus {
  CONFIG_ACK_STATUS_UNSPECIFIED = 0;
  APPLIED = 1;
  REJECTED = 2;
  FAILED = 3;
}

// Backend -> scanner. Published to the per-device config queue whenever a
// session's settings change (including when a preset is applied, which goes
// through exactly the same pipeline).
message ConfigPush {
  // Unique per push; the ack references it back.
  string push_id = 1;
  string device_id = 2;
  string session_id = 3;
  // Set when the config was applied from a preset (empty for ad-hoc custom).
  string preset_id = 4;
  ScanConfig config = 5;
  uint64 issued_at_unix_ms = 6;
}

message ScanConfig {
  repeated InterfaceConfig interfaces = 1;
  // Dwell time per channel during hopping, in ms.
  uint32 channel_hop_ms = 2;
  bool scan_wifi = 3;
  bool scan_bluetooth = 4;
  bool scan_bt_le = 5;
  // Promiscuous-mode client detection on supported monitor-mode adapters.
  bool scan_clients_promiscuous = 6;
  // Batch flush cadence in ms (default 1500).
  uint32 batch_interval_ms = 7;
}

message InterfaceConfig {
  // Kernel interface name, e.g. "wlan0".
  string name = 1;
  // Driver name, e.g. "nl80211".
  string driver = 2;
  bool monitor_mode = 3;
  bool enabled = 4;
  // Channels to hop. Empty = all channels supported by the adapter.
  repeated uint32 channels = 5;
}

// Scanner -> backend. Confirms (or rejects) a config push.
message ConfigAck {
  string push_id = 1;
  string device_id = 2;
  ConfigAckStatus status = 3;
  string error = 4;
  uint64 applied_at_unix_ms = 5;
}
