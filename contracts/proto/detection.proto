syntax = "proto3";

package sigmap;

option csharp_namespace = "Sigmap.Contracts.Proto";

enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  AP = 1;                // Access point (BSSID + SSID)
  BLUETOOTH = 2;         // Classic BT device
  BT_LE = 3;             // Bluetooth Low Energy advertiser
  CLIENT = 4;            // Client device of an AP (promiscuous / probe requests)
}

enum Encryption {
  ENCRYPTION_UNSPECIFIED = 0;
  OPEN = 1;
  WEP = 2;
  WPA = 3;
  WPA2 = 4;
  WPA3 = 5;
}

// A GPS fix recorded by a scanner device. Detections are shipped without a
// location; the backend resolves location against these samples using the
// swarm context (see LocationResolver). Devices without GPS simply send no
// samples and their detections resolve to "unlocated".
message GpsSample {
  double lat = 1;
  double lon = 2;
  double accuracy_m = 3;
  uint64 at_unix_ms = 4;
}

message Detection {
  DeviceType device_type = 1;
  // BSSID for APs, MAC for clients, BT MAC/address when available.
  string mac = 2;
  string ssid = 3;
  string bt_name = 4;
  string bt_uuid = 5;
  // Signal strength in dBm (negative values).
  int32 signal_dbm = 6;
  uint32 channel = 7;
  // WPA state of the AP (only populated for AP detections).
  Encryption encryption = 8;
  uint64 detected_at_unix_ms = 9;
  // First three bytes of the MAC, used for vendor OUI enrichment.
  bytes vendor_oui = 10;
}

// Scanner -> backend. Flushed by the agent at a configurable cadence
// (default 1-2s); never one message per detection.
message DetectionBatch {
  string device_id = 1;
  // Unique per batch, the idempotency key enforced by Postgres.
  string batch_id = 2;
  // True if this device has a GPS receiver and samples are present.
  bool has_gps = 3;
  repeated GpsSample gps_samples = 4;
  repeated Detection detections = 5;
}

// Location resolution outcome; used by the live stream, not by the scanner.
enum LocationFlag {
  LOCATION_FLAG_UNSPECIFIED = 0;
  GPS = 1;
  INFERRED = 2;
  UNLOCATED = 3;
}

message LocatedDetection {
  Detection detection = 1;
  // Present iff location_flag is GPS or INFERRED.
  double lat = 2;
  double lon = 3;
  LocationFlag location_flag = 4;
}

// Post-ingestion event: a batch with server-resolved locations, broadcast on
// sigmap.events and re-broadcast to browsers via the BFF live stream.
message LocatedBatch {
  string batch_id = 1;
  string device_id = 2;
  string session_id = 3;
  repeated LocatedDetection detections = 4;
}
