syntax = "proto3";

package sigmap;

import "detection.proto";
import "config.proto";
import "heartbeat.proto";
import "pairing.proto";
import "live.proto";

option csharp_namespace = "Sigmap.Contracts.Proto";

// Envelope is the single wire format for every message crossing a transport
// boundary (RabbitMQ or the HTTPS ingest endpoint). schema_version guards
// against silent drift between backend, scanner agent and Android.
message Envelope {
  // Unique per logical operation; for detection batches this is the batch_id
  // and acts as the idempotency key in Postgres.
  string message_id = 1;
  // Schema version string, e.g. "1". Consumers reject unknown versions.
  string schema_version = 2;
  // Send time in unix epoch milliseconds (UTC).
  uint64 sent_at_unix_ms = 3;
  oneof payload {
    DetectionBatch detection_batch = 10;
    ConfigPush config_push = 11;
    ConfigAck config_ack = 12;
    Heartbeat heartbeat = 13;
    PairingRequest pairing_request = 14;
    PairingResponse pairing_response = 15;
    // Internal events exchange payload (backend -> BFF).
    sigmap.live.LiveEvent live_event = 16;
  }
}
